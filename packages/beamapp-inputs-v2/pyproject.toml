[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beamapp-inputs-v2"
version = "0.1.2"
description = "Typed Inputs and Design Brain core for Beamapp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "plotly",
    "streamlit",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["inputs_v2*"]
