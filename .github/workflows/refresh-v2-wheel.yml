name: Refresh V2 wheel on architecture branch

on:
  push:
    branches:
      - agent/architecture-and-calc-page-performance

permissions:
  contents: write

jobs:
  refresh-v2-wheel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-and-calc-page-performance
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build current V2 wheel
        run: |
          python -m pip install --upgrade pip build
          rm -rf packages/beamapp-inputs-v2/dist packages/beamapp-inputs-v2/build
          python -m build --wheel packages/beamapp-inputs-v2
          cp packages/beamapp-inputs-v2/dist/beamapp_inputs_v2-0.1.2-py3-none-any.whl vendor/beamapp_inputs_v2-0.1.2-py3-none-any.whl

      - name: Verify source and wheel match
        run: python tools/verification/verify_vendored_inputs_v2.py

      - name: Commit refreshed wheel only
        run: |
          if git diff --quiet -- vendor/beamapp_inputs_v2-0.1.2-py3-none-any.whl; then
            echo 'Vendored wheel already matches current source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/beamapp_inputs_v2-0.1.2-py3-none-any.whl
          git commit -m 'Refresh vendored V2 after full-width presentation update'
          git push origin HEAD:agent/architecture-and-calc-page-performance
