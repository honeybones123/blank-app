name: One-shot Deflection authority reuse
on:
  push:
    branches: [perf/summary-first-closeout-2026-08-18]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/summary-first-closeout-2026-08-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Reuse authoritative Deflection publication
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('deflection_page_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if (\n        st.session_state.get("_deflection_core_cache_key") != _deflection_cache_key\n        or not _deflection_params_present\n        or not _deflection_report_present\n    ):\n        compute_deflection_results(publish=True)\n        st.session_state["_deflection_core_cache_key"] = _deflection_cache_key\n'''
          new = '''    # The application result-page boundary refreshes Deflection authoritatively\n    # before this renderer is entered.  If that publication is present, reuse\n    # it rather than rebuilding the same report because this page-local cache\n    # has not yet been seeded in a fresh browser session.  The fallback remains\n    # for isolated/defensive renderer use where no authoritative publication\n    # exists.\n    if not _deflection_params_present or not _deflection_report_present:\n        compute_deflection_results(publish=True)\n    st.session_state["_deflection_core_cache_key"] = _deflection_cache_key\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Deflection publication guard, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Add authority-reuse contract
        run: |
          cat > tests/test_deflection_authoritative_publication_reuse.py <<'PYTEST'
          from pathlib import Path


          def test_deflection_renderer_reuses_authoritative_publication_when_present():
              source = Path('deflection_page_runtime.py').read_text(encoding='utf-8')
              start = source.index('    from deflection_core import compute_deflection_results')
              end = source.index('    render_timing_mark("deflection_page.runtime.compute.publication.end")', start)
              block = source[start:end]

              assert 'if not _deflection_params_present or not _deflection_report_present:' in block
              assert block.count('compute_deflection_results(publish=True)') == 1
              assert 'st.session_state["_deflection_core_cache_key"] = _deflection_cache_key' in block
              assert 'st.session_state.get("_deflection_core_cache_key") != _deflection_cache_key' not in block


          def test_deflection_authoritative_result_boundary_remains_documented():
              source = Path('deflection_page_runtime.py').read_text(encoding='utf-8')
              assert 'application result-page boundary refreshes Deflection authoritatively' in source
          PYTEST

      - name: Compile and test
        run: |
          python -m pip install -r requirements.txt pytest
          python -m py_compile deflection_page_runtime.py
          python -m pytest -q \
            tests/test_deflection_authoritative_publication_reuse.py \
            tests/test_summary_first_render_contract.py \
            tests/test_authoritative_check_packs.py \
            tests/test_page_rerun_architecture.py \
            tests/test_pending_widget_transaction_authority.py \
            tests/test_time_dependent_engineering_state.py \
            tests/test_calculation_page_performance_ui_freeze.py

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/one-shot-deflection-authority-reuse.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deflection_page_runtime.py tests/test_deflection_authoritative_publication_reuse.py .github/workflows/one-shot-deflection-authority-reuse.yml
          git diff --cached --check
          git commit -m 'Reuse authoritative Deflection publication'
          git push origin HEAD:perf/summary-first-closeout-2026-08-18
