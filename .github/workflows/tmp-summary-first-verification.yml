name: Temporary summary-first verification
# Trigger verification after workflow registration.
on:
  push:
    branches: [perf/summary-first-closeout-2026-08-18]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/summary-first-closeout-2026-08-18
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run all-page navigation and state-continuity browser audit
        run: |
          mkdir -p artifacts/summary-first-verification
          python -m streamlit run app.py \
            --server.headless=true \
            --server.fileWatcherType=none \
            --server.port=8522 \
            >/tmp/summary-first-streamlit.log 2>&1 &
          APP_PID=$!
          cleanup() { kill "$APP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen

          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  with urlopen('http://127.0.0.1:8522') as response:
                      if response.status < 500:
                          break
              except Exception:
                  pass
              time.sleep(0.1)
          else:
              raise SystemExit('Streamlit did not become ready')
          PY
          python tools/verification/helpers/navigation_summary_continuity_audit.py \
            --base-url http://127.0.0.1:8522 \
            --cid summary-first-navigation \
            --output artifacts/summary-first-verification/navigation.json
          cleanup
          trap - EXIT

      - name: Benchmark representative pages before migration
        run: |
          git worktree add --detach /tmp/summary-first-before e088f048bf997f814079fd0e87905f2501a8d5c5
          cd /tmp/summary-first-before
          python tools/verification/helpers/cold_page_benchmark.py \
            --page bending --page shear --page deflection \
            --runs 2 --mode navigation --no-trace \
            --starting-port 8700 \
            --output "$GITHUB_WORKSPACE/artifacts/summary-first-verification/before.json"

      - name: Benchmark representative pages after migration
        run: |
          python tools/verification/helpers/cold_page_benchmark.py \
            --page bending --page shear --page deflection \
            --runs 2 --mode navigation --no-trace \
            --starting-port 8800 \
            --output artifacts/summary-first-verification/after.json

      - name: Compare timing evidence and enforce current cold-page ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/summary-first-verification')
          before = json.loads((root / 'before.json').read_text())
          after = json.loads((root / 'after.json').read_text())
          rows = []
          failed = []
          for page in ('bending', 'shear', 'deflection'):
              b = before['pages'][page]['summary']['median_page_open_ms']
              a = after['pages'][page]['summary']['median_page_open_ms']
              delta = round(a - b, 3)
              pct = round((delta / b) * 100.0, 2) if b else None
              under = bool(after['pages'][page]['summary']['all_under_1000_ms'])
              rows.append({
                  'page': page,
                  'before_median_ms': b,
                  'after_median_ms': a,
                  'delta_ms': delta,
                  'delta_percent': pct,
                  'all_after_runs_under_1000_ms': under,
              })
              if not under:
                  failed.append(page)
          report = {'pages': rows, 'after_ceiling_pass': not failed}
          (root / 'comparison.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if failed:
              raise SystemExit(f'Cold-page ceiling failed: {failed}')
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-first-verification
          path: artifacts/summary-first-verification
