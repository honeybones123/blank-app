name: Temporary browser UX freeze
on:
  push:
    branches: [perf/calc-pages-profile-2026-08-17]
  workflow_dispatch:

jobs:
  compare-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CODEX_DISABLE_CALC_PAGE_WARMUP: "1"
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/calc-pages-profile-2026-08-17
          path: head
      - name: Checkout PR8 baseline
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-and-calc-page-performance
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: head/requirements.txt
      - name: Install runtime and browser
        run: |
          cd head
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start baseline and candidate apps
        run: |
          (cd base && python -m streamlit run app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 > /tmp/base.log 2>&1 & echo $! > /tmp/base.pid)
          (cd head && python -m streamlit run app.py --server.headless true --server.port 8502 --server.address 127.0.0.1 > /tmp/head.log 2>&1 & echo $! > /tmp/head.pid)
          python - <<'PY'
          import time, urllib.request
          for port in (8501, 8502):
              deadline=time.time()+60
              while time.time()<deadline:
                  try:
                      with urllib.request.urlopen(f'http://127.0.0.1:{port}/_stcore/health', timeout=2) as r:
                          if r.status == 200:
                              break
                  except Exception:
                      time.sleep(.5)
              else:
                  raise SystemExit(f'app on {port} did not become healthy')
          PY
      - name: Compare visible browser contract
        run: |
          mkdir -p browser-artifacts
          python - <<'PY'
          from pathlib import Path
          import json, traceback
          from PIL import Image, ImageChops
          from playwright.sync_api import sync_playwright

          OUT = Path('browser-artifacts')
          BASE='http://127.0.0.1:8501'
          HEAD='http://127.0.0.1:8502'

          def snap(root, slug, name, mutate=None):
              with sync_playwright() as p:
                  browser=p.chromium.launch()
                  page=browser.new_page(viewport={'width':1600,'height':1100}, device_scale_factor=1)
                  page.goto(f'{root}/?page={slug}', wait_until='domcontentloaded', timeout=60000)
                  page.locator('h1').first.wait_for(state='visible', timeout=60000)
                  page.wait_for_timeout(2500)
                  if mutate:
                      mutate(page)
                      page.wait_for_timeout(2200)
                  metrics={
                      'h1': page.locator('h1').first.inner_text(),
                      'expanders': page.locator('div[data-testid="stExpander"] details').count(),
                      'number_inputs': page.locator('input[type="number"]').count(),
                      'radios': page.locator('div[role="radiogroup"]').count(),
                      'body_text': page.locator('body').inner_text(),
                  }
                  page.screenshot(path=str(OUT/f'{name}.png'), full_page=True, animations='disabled')
                  browser.close()
                  return metrics

          def open_first_expander(page):
              details=page.locator('div[data-testid="stExpander"] details')
              if details.count() < 1:
                  raise AssertionError('No expander found')
              details.nth(0).locator('summary').click()

          def switch_bending_state_tab(page):
              tab=page.get_by_text('SLS (cracked)', exact=True)
              if tab.count() < 1:
                  raise AssertionError('SLS (cracked) state tab not found')
              tab.first.click()

          cases=[
              ('bending','bending-default',None),
              ('bending','bending-sls-tab',switch_bending_state_tab),
              ('shear','shear-closed',None),
              ('shear','shear-first-open',open_first_expander),
          ]
          report={}
          failures=[]
          for slug,name,mutate in cases:
              try:
                  bm=snap(BASE,slug,'base-'+name,mutate)
                  hm=snap(HEAD,slug,'head-'+name,mutate)
                  text_same=bm['body_text']==hm['body_text']
                  structural_same=all(bm[k]==hm[k] for k in ('h1','expanders','number_inputs','radios'))
                  a=Image.open(OUT/f'base-{name}.png').convert('RGB')
                  b=Image.open(OUT/f'head-{name}.png').convert('RGB')
                  if a.size != b.size:
                      pixel_ratio=1.0
                  else:
                      d=ImageChops.difference(a,b)
                      if d.getbbox() is None:
                          pixel_ratio=0.0
                      else:
                          import numpy as np
                          aa=np.asarray(a, dtype=np.int16)
                          bb=np.asarray(b, dtype=np.int16)
                          changed=np.any(np.abs(aa-bb)>8, axis=2)
                          pixel_ratio=float(changed.mean())
                  report[name]={
                      'text_same':text_same,
                      'structural_same':structural_same,
                      'pixel_changed_ratio':pixel_ratio,
                      'base':{k:v for k,v in bm.items() if k!='body_text'},
                      'head':{k:v for k,v in hm.items() if k!='body_text'},
                  }
                  if not text_same or not structural_same or pixel_ratio > 0.001:
                      failures.append(name)
              except Exception as exc:
                  report[name]={'error':f'{type(exc).__name__}: {exc}','traceback':traceback.format_exc()}
                  failures.append(name)
              (OUT/'report.json').write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          if failures:
              raise SystemExit('UX freeze mismatch: '+', '.join(failures))
          PY
      - name: Upload browser comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ux-freeze
          path: browser-artifacts
      - name: Show app logs on failure
        if: failure()
        run: |
          echo '--- BASE ---'; tail -200 /tmp/base.log || true
          echo '--- HEAD ---'; tail -200 /tmp/head.log || true
