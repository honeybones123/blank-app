name: Temporary calculation page profile
on:
  push:
    branches: [perf/calc-pages-profile-2026-08-17]
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEX_DISABLE_CALC_PAGE_WARMUP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/calc-pages-profile-2026-08-17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Profile real app routes
        run: |
          python - <<'PY'
          import json
          import time
          from streamlit.testing.v1 import AppTest

          PAGES = ("bending", "shear", "creep", "shrinkage", "crack", "deflection")

          def page_status(page):
              try:
                  from application.page_module_registry import calculation_page_render_status
                  return calculation_page_render_status(page)
              except Exception as exc:
                  return {"status_error": f"{type(exc).__name__}: {exc}"}

          results = {}
          for page in PAGES:
              at = AppTest.from_file("app.py", default_timeout=60)
              at.query_params["page"] = page
              t0 = time.perf_counter()
              at.run(timeout=60)
              t1 = time.perf_counter()
              cold = {
                  "wall_ms": round((t1 - t0) * 1000, 1),
                  "renderer": page_status(page),
                  "exceptions": [str(x.value) for x in at.exception],
              }
              t2 = time.perf_counter()
              at.run(timeout=60)
              t3 = time.perf_counter()
              warm = {
                  "wall_ms": round((t3 - t2) * 1000, 1),
                  "renderer": page_status(page),
                  "exceptions": [str(x.value) for x in at.exception],
              }
              results[page] = {"cold": cold, "warm": warm}
              print("PAGE", page, json.dumps(results[page], sort_keys=True))

          # Bending card policy comparison on one identical app state. These
          # runs use the canonical state keys so no page-specific renderer is introduced.
          at = AppTest.from_file("app.py", default_timeout=60)
          at.query_params["page"] = "bending"
          at.run(timeout=60)
          card_results = {}
          for label, key in (
              ("light_mounted_1_5", "step_open_bending_uls_authoritative_5"),
              ("heavy_diagram_1_1", "step_open_bending_uls_authoritative_1"),
          ):
              at.session_state[key] = True
              before_plots = len(at.get("plotly_chart"))
              t0 = time.perf_counter()
              at.run(timeout=60)
              t1 = time.perf_counter()
              after_plots = len(at.get("plotly_chart"))
              card_results[label] = {
                  "open_full_rerun_ms": round((t1 - t0) * 1000, 1),
                  "renderer": page_status("bending"),
                  "plotly_before": before_plots,
                  "plotly_after": after_plots,
                  "exceptions": [str(x.value) for x in at.exception],
              }
              at.session_state[key] = False
              at.run(timeout=60)
              print("CARD", label, json.dumps(card_results[label], sort_keys=True))

          print("RESULTS_JSON=" + json.dumps({"pages": results, "bending_cards": card_results}, sort_keys=True))
          PY
