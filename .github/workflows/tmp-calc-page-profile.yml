name: Temporary calculation page profile
on:
  push:
    branches: [perf/calc-pages-profile-2026-08-17]
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEX_DISABLE_CALC_PAGE_WARMUP: "1"
      CODEX_RENDER_TIMING_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/calc-pages-profile-2026-08-17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Trace bending and shear
        run: |
          python - <<'PY'
          import json
          import time
          from streamlit.testing.v1 import AppTest

          def read_state(at, key, default=None):
              try:
                  return at.session_state[key]
              except Exception:
                  return default

          def summarize(page):
              at = AppTest.from_file("app.py", default_timeout=60)
              at.query_params["page"] = page
              at.run(timeout=60)
              t0 = time.perf_counter()
              at.run(timeout=60)
              wall_ms = (time.perf_counter() - t0) * 1000.0
              events = list(read_state(at, "_render_timing_events", []) or [])
              slow = sorted(
                  [
                      {
                          "name": e.get("name"),
                          "delta_ms": e.get("delta_ms"),
                          "elapsed_ms": e.get("elapsed_ms"),
                          "meta": e.get("meta"),
                      }
                      for e in events
                      if isinstance(e, dict)
                  ],
                  key=lambda e: float(e.get("delta_ms") or 0.0),
                  reverse=True,
              )[:25]
              from application.page_module_registry import calculation_page_render_status
              result = {
                  "wall_ms": round(wall_ms, 1),
                  "renderer": calculation_page_render_status(page),
                  "slow_marks": slow,
                  "event_count": len(events),
                  "exceptions": [str(x.value) for x in at.exception],
              }
              print("TRACE", page, json.dumps(result, sort_keys=True))

          summarize("bending")
          summarize("shear")
          PY
