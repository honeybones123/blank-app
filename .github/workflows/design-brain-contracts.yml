name: Design Brain architecture contracts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-brain-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-shear-visual-lazy-fix:
    name: Apply measured Shear visualisation optimisation
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'perf/summary-first-closeout-2026-08-18'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: perf/summary-first-closeout-2026-08-18
          fetch-depth: 0

      - name: Apply exact presentation-only change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('shear_page_runtime.py')
          text = path.read_text(encoding='utf-8')
          start_marker = 'def _render_shear_visualisation_block(theta_v_deg: float | None = None):\n'
          end_marker = '\n\ndef build_reo_circles_from_state(shape_code: str, dims: dict):\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          if old.count('_render_shear_side_view()') != 1 or old.count('_render_shear_cross_section()') != 1 or old.count('_render_shear_force_diagram()') != 1:
              raise SystemExit('unexpected Shear visualisation block; refusing approximate edit')
          if 'render_stable_tabs(' not in old:
              raise SystemExit('expected eager native-tab path not found')

          new = '''def _render_shear_visualisation_block(theta_v_deg: float | None = None):
    with st.container():
        st.markdown(
            """
<style>
/* Shear page only: keep the existing visual frame while rendering one selected diagram. */
div[data-testid="stVerticalBlock"]:has(> div[data-testid="stElementContainer"] #shear-visuals-block) {
    margin-top: 0.25rem !important;
    padding-top: 0 !important;
}
div[data-testid="stVerticalBlock"]:has(> div[data-testid="stElementContainer"] #shear-visuals-block) .section-title {
    margin-bottom: 0.35rem !important;
}
div[data-testid="stVerticalBlock"]:has(> div[data-testid="stElementContainer"] #shear-visuals-block) [data-testid="stPlotlyChart"] {
    margin-bottom: 0.2rem !important;
}
div[data-testid="stVerticalBlock"]:has(> div[data-testid="stElementContainer"] #shear-visuals-block) div[data-testid="stRadio"] {
    margin-top: 0.25rem !important;
    padding-top: 0 !important;
}
</style>
<div id="shear-visuals-block" class="shear-visuals-block" style="display:none;width:0;height:0;overflow:hidden;" aria-hidden="true"></div>
""",
            unsafe_allow_html=True,
        )
        render_section_title("Visualisation")

        # Presentation-only selector. Existing diagram builders remain the
        # sole source of each visual; the fragment prevents a visual switch
        # from rerunning the engineering page or authoritative calculations.
        @st.fragment
        def _render_shear_visualisation_fragment() -> None:
            visual_mode = st.radio(
                "Visualisation view",
                options=("Side view", "Section", "Shear diagram"),
                key="shear_visualisation_panel",
                horizontal=True,
                label_visibility="collapsed",
            )
            if visual_mode == "Section":
                _render_shear_cross_section()
            elif visual_mode == "Shear diagram":
                _render_shear_force_diagram()
            else:
                _render_shear_side_view()

        _render_shear_visualisation_fragment()
'''
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')
          PY

      - name: Add permanent contract
        run: |
          cat > tests/test_shear_visualisation_lazy_contract.py <<'PYTEST'
          from pathlib import Path

          def _visual_block() -> str:
              source = Path('shear_page_runtime.py').read_text(encoding='utf-8')
              start = source.index('def _render_shear_visualisation_block(')
              end = source.index('\n\ndef build_reo_circles_from_state', start)
              return source[start:end]

          def test_shear_visualisation_selection_is_fragment_scoped_and_presentation_only():
              block = _visual_block()
              assert '@st.fragment' in block
              assert 'key="shear_visualisation_panel"' in block
              assert 'options=("Side view", "Section", "Shear diagram")' in block
              assert 'render_stable_tabs(' not in block

          def test_shear_visualisation_reuses_each_existing_builder_once():
              block = _visual_block()
              assert block.count('_render_shear_side_view()') == 1
              assert block.count('_render_shear_cross_section()') == 1
              assert block.count('_render_shear_force_diagram()') == 1
              assert 'if visual_mode == "Section":' in block
              assert 'elif visual_mode == "Shear diagram":' in block
          PYTEST

      - name: Focused safety gate
        run: |
          python -m pip install -r requirements.txt pytest
          python -m py_compile shear_page_runtime.py
          python -m pytest -q \
            tests/test_shear_visualisation_lazy_contract.py \
            tests/test_summary_first_render_contract.py \
            tests/test_authoritative_check_packs.py \
            tests/test_page_rerun_architecture.py \
            tests/test_pending_widget_transaction_authority.py \
            tests/test_calculation_page_performance_ui_freeze.py

      - name: Restore CI workflow and commit product change
        run: |
          cat > .github/workflows/design-brain-contracts.yml <<'YAML'
          name: Design Brain architecture contracts

          on:
            push:
              branches:
                - main
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: design-brain-contracts-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify-design-brain:
              name: Verify Runtime Design Brain
              runs-on: ubuntu-latest
              timeout-minutes: 30

              steps:
                - name: Check out Runtime
                  uses: actions/checkout@v4

                - name: Set up Python 3.12
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                    cache: pip
                    cache-dependency-path: |
                      requirements.txt
                      packages/beamapp-inputs-v2/pyproject.toml
                      packages/beamapp-inputs-v2/requirements.txt

                - name: Verify Render vendored V2 artifact matches source
                  run: python tools/verification/verify_vendored_inputs_v2.py

                - name: Install Runtime-owned V2 and test dependencies
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install -e "./packages/beamapp-inputs-v2[test]"

                - name: Enforce architecture boundaries
                  working-directory: packages/beamapp-inputs-v2
                  run: python tools/architecture_check.py

                - name: Run all V2 contracts and tests
                  working-directory: packages/beamapp-inputs-v2
                  run: python -m pytest -q -p no:cacheprovider tests

                - name: Audit every Design Brain family outcome
                  working-directory: packages/beamapp-inputs-v2
                  run: python tools/design_brain_completion_audit.py

                - name: Verify calculation parity
                  working-directory: packages/beamapp-inputs-v2
                  run: python tools/shadow_parity_report.py

                - name: Verify Runtime Apply boundary
                  run: python -m tools.verification.inputs_apply_full_rerun_contract

                - name: Verify clean installed-package boundary
                  run: >-
                    python tools/verification/run_inputs_v2_clean_install_contract.py
                    --runtime-vendored
          YAML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shear_page_runtime.py tests/test_shear_visualisation_lazy_contract.py .github/workflows/design-brain-contracts.yml
          git diff --cached --check
          git commit -m 'Render only selected Shear visualisation'
          git push origin HEAD:perf/summary-first-closeout-2026-08-18

  verify-design-brain:
    name: Verify Runtime Design Brain
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Runtime
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packages/beamapp-inputs-v2/pyproject.toml
            packages/beamapp-inputs-v2/requirements.txt

      - name: Verify Render vendored V2 artifact matches source
        run: python tools/verification/verify_vendored_inputs_v2.py

      - name: Install Runtime-owned V2 and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/beamapp-inputs-v2[test]"

      - name: Enforce architecture boundaries
        working-directory: packages/beamapp-inputs-v2
        run: python tools/architecture_check.py

      - name: Run all V2 contracts and tests
        working-directory: packages/beamapp-inputs-v2
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Audit every Design Brain family outcome
        working-directory: packages/beamapp-inputs-v2
        run: python tools/design_brain_completion_audit.py

      - name: Verify calculation parity
        working-directory: packages/beamapp-inputs-v2
        run: python tools/shadow_parity_report.py

      - name: Verify Runtime Apply boundary
        run: python -m tools.verification.inputs_apply_full_rerun_contract

      - name: Verify clean installed-package boundary
        run: >-
          python tools/verification/run_inputs_v2_clean_install_contract.py
          --runtime-vendored
