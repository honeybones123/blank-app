name: Fix shell CSS owner on architecture branch

on:
  push:
    branches:
      - agent/architecture-and-calc-page-performance

permissions:
  contents: write

jobs:
  fix-shell-css-owner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/architecture-and-calc-page-performance
          fetch-depth: 0

      - name: Move shared shell CSS into render cycle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          source = path.read_text(encoding='utf-8-sig')

          top_level = '''\n_apply_sharp_embed_css()\n\nfrom widgets_helpers import (\n'''
          if source.count(top_level) != 1:
              raise SystemExit('Expected exactly one top-level shared shell CSS call')
          source = source.replace(top_level, '''\nfrom widgets_helpers import (\n''', 1)

          old_main = '''    # The wide responsive layout is emitted once above during normal script\n    # composition. Re-emitting the identical style block here doubled the\n    # websocket payload on every route change without changing the UI.\n    _apply_normal_user_page_zoom_css()\n'''
          new_main = '''    # The application shell owns width, padding and base scale on every route.\n    # Emit the shared shell CSS inside the render cycle so page- or component-\n    # local styles cannot leave Start, Inputs or result pages at different\n    # container widths after navigation. This remains one emission per rerun.\n    _apply_sharp_embed_css()\n    _apply_normal_user_page_zoom_css()\n'''
          if source.count(old_main) != 1:
              raise SystemExit('Expected exactly one old main shell CSS comment/call')
          source = source.replace(old_main, new_main, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify ownership shape
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('app.py').read_text(encoding='utf-8')
          assert src.count('_apply_sharp_embed_css()') == 2  # definition + one call
          main = src[src.index('def main():'):]
          assert main.index('_apply_sharp_embed_css()') < main.index('_apply_normal_user_page_zoom_css()')
          assert main.index('_apply_normal_user_page_zoom_css()') < main.index('_render_project_header_compact()')
          PY

      - name: Commit shell ownership fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Keep shared shell CSS authoritative on every route'
          git push origin HEAD:agent/architecture-and-calc-page-performance
