name: Temporary shear timing probe
on:
  push:
    branches: [agent/architecture-and-calc-page-performance]
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/beamapp-inputs-v2/pyproject.toml
      - run: python -m pip install -e './packages/beamapp-inputs-v2[test]'
      - name: Measure actual shear completion time
        working-directory: packages/beamapp-inputs-v2
        run: |
          python - <<'PY'
          import time
          from pathlib import Path
          from streamlit.testing.v1 import AppTest

          root = Path.cwd()
          app_path = root / 'src' / 'inputs_v2' / 'app.py'

          for i in range(1, 4):
              t0 = time.perf_counter()
              app = AppTest.from_file(str(app_path), default_timeout=30).run()
              if not app.session_state['v2_design_started']:
                  next(button for button in app.button if button.label == 'Go to Design Inputs').click().run(timeout=30)
              t1 = time.perf_counter()
              shear_action = next(widget for widget in app.number_input if widget.label == 'Design shear Vu* (kN)')
              shear_action.set_value(300.0).run(timeout=30)
              t2 = time.perf_counter()
              reached = any('SHEAR_FAIL' in item.value for item in app.markdown)
              print(f'attempt={i} startup={t1-t0:.3f}s shear_run={t2-t1:.3f}s total={t2-t0:.3f}s reached_shear_fail={reached}')
              if not reached:
                  raise SystemExit('Did not reach SHEAR_FAIL')
          PY
