name: Temporary shear timing probe
on:
  push:
    branches: [agent/architecture-and-calc-page-performance]
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/beamapp-inputs-v2/pyproject.toml
      - run: python -m pip install -e './packages/beamapp-inputs-v2[test]'
      - name: Repeat main-branch shear AppTest with timing
        working-directory: packages/beamapp-inputs-v2
        run: |
          for i in 1 2 3; do
            echo "=== main shear attempt $i ==="
            /usr/bin/time -f 'elapsed=%e sec' python -m pytest -q tests/test_app.py::test_design_brain_selects_shear_family_when_shear_fails || true
          done
