# Temporary measurement-only workflow. Compares the Aug 14 fast-cold-navigation commit with current PR #8 using the exact same verifier.
name: Temporary Bending cold regression comparison
on:
  push:
    branches: [perf/bending-diagram-profile-2026-08-18]
  pull_request:
  workflow_dispatch:

jobs:
  compare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bending-diagram-profile-2026-08-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install one controlled runtime and Chromium
        run: |
          git show 215066eb0e89a53fe4a929c726610f6e6a91b8d9:requirements.txt > /tmp/current-requirements.txt
          python -m pip install -r /tmp/current-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Create isolated old and current worktrees
        run: |
          git worktree add --detach /tmp/bending-old 3fb890e19ef13ec0994a6012dc9b36bb85c5e56e
          git worktree add --detach /tmp/bending-current 215066eb0e89a53fe4a929c726610f6e6a91b8d9
          mkdir -p /tmp/bending-old/tools/verification/helpers
          git show 215066eb0e89a53fe4a929c726610f6e6a91b8d9:tools/verification/helpers/cold_page_benchmark.py > /tmp/bending-old/tools/verification/helpers/cold_page_benchmark.py
      - name: Benchmark Aug 14 fast-cold-navigation commit
        working-directory: /tmp/bending-old
        run: >-
          python tools/verification/helpers/cold_page_benchmark.py
          --page bending
          --runs 2
          --max-invalid-attempts 3
          --mode navigation
          --starting-port 8900
          --output /tmp/bending-old.json
      - name: Benchmark current PR8 head
        working-directory: /tmp/bending-current
        run: >-
          python tools/verification/helpers/cold_page_benchmark.py
          --page bending
          --runs 2
          --max-invalid-attempts 3
          --mode navigation
          --starting-port 9000
          --output /tmp/bending-current.json
      - name: Compare results
        run: |
          mkdir -p artifacts
          cp /tmp/bending-old.json artifacts/bending-old.json
          cp /tmp/bending-current.json artifacts/bending-current.json
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('/tmp/bending-old.json').read_text())['pages']['bending']
          cur=json.loads(Path('/tmp/bending-current.json').read_text())['pages']['bending']
          def compact(x):
              return {
                  'median_page_open_ms': x['summary']['median_page_open_ms'],
                  'runs': [
                      {
                          'page_open_ms': r['page_open_ms'],
                          'page_renderer_ms': r.get('page_renderer_ms'),
                          'dispatch_ms': r.get('dispatch_ms'),
                          'websocket_received_bytes': r.get('websocket_received_bytes'),
                          'websocket_received_frames': r.get('websocket_received_frames'),
                          'markdown_total_chars': r.get('markdown_total_chars'),
                          'top_trace_deltas': (r.get('top_trace_deltas') or [])[:8],
                      }
                      for r in x['runs']
                  ],
              }
          out={'old_3fb890e': compact(old), 'current_215066e': compact(cur)}
          out['median_regression_ms']=round(out['current_215066e']['median_page_open_ms']-out['old_3fb890e']['median_page_open_ms'],3)
          out['median_ratio']=round(out['current_215066e']['median_page_open_ms']/out['old_3fb890e']['median_page_open_ms'],3)
          print(json.dumps(out, indent=2))
          Path('artifacts/bending-cold-regression-comparison.json').write_text(json.dumps(out, indent=2), encoding='utf-8')
          PY
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bending-cold-regression-comparison
          path: artifacts
