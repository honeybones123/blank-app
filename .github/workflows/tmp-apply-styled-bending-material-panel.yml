name: Temporary styled bending material panel
on:
  push:
    branches: [perf/summary-first-closeout-2026-08-18]
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/summary-first-closeout-2026-08-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Delegate the runtime panel to the styled component
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bending_page_runtime.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "from engineering_page_sections.stable_tabs import render_stable_tabs\n"
          import_line = (
              "from engineering_page_sections.bending_material_teaching import "
              "render_bending_material_teaching_panel\n"
          )
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("stable-tabs import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          start_marker = "                def _render_material_model_content():\n"
          end_marker = "                render_lazy_expander(\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("material-panel function start not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("material-panel expander call not found")

          delegate = '''                def _render_material_model_content():
                    selected_state = str(
                        st.session_state.get("bending_state_main", main_state) or main_state
                    )
                    render_bending_material_teaching_panel(
                        selected_state=selected_state,
                        plot_material_curves=_plot_material_stress_strain_curves,
                        render_plotly_diagram=render_plotly_diagram,
                    )

'''
          text = text[:start] + delegate + text[end:]
          text = text.replace(
              '"ℹ️ Stress–strain model & material behaviour"',
              '"ℹ️ From strain to stress to internal force"',
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Compile and run targeted contract
        run: |
          python -m py_compile bending_page_runtime.py engineering_page_sections/bending_material_teaching.py
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_bending_material_teaching_panel.py
      - name: Commit the runtime delegation
        run: |
          if git diff --quiet -- bending_page_runtime.py; then
            echo 'No runtime change to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bending_page_runtime.py
          git commit -m 'Use styled stress strain teaching panel'
          git push origin HEAD:perf/summary-first-closeout-2026-08-18
