name: Temporary MCFT strain zoom fix

on:
  push:
    branches:
      - fix/mcft-strain-zoom-workflow-final

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply MCFT strain zoom fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch actual MCFT diagram builder on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B tmp-mcft origin/main
          python - <<'PY'
          from pathlib import Path
          path = Path('ui/diagrams/mcft_diagram.py')
          text = path.read_text(encoding='utf-8')
          old = 'MCFT_CHECK4_STRAIN_Y_PAD = 0.28'
          new = 'MCFT_CHECK4_STRAIN_Y_PAD = 0.55'
          if old not in text:
              raise SystemExit(f'Expected line not found: {old}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/diagrams/mcft_diagram.py
          git commit -m 'Zoom out MCFT Check 4 strain diagram further'
          git push origin HEAD:main
