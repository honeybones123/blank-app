name: Temporary post-PR9 calc profile
on:
  push:
    branches: [perf/post-pr9-profile-2026-08-18]
  pull_request:
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and browser
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run authoritative cold-page benchmark
        run: >-
          python tools/verification/helpers/cold_page_benchmark.py
          --runs 2
          --mode navigation
          --output artifacts/post_pr9_cold_profile.json
      - name: Upload profile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-pr9-cold-page-profile
          path: artifacts/post_pr9_cold_profile.json
